# Both services run in the host network namespace on purpose: the whole point of
# this box is that its egress goes through ProtonVPN, and a bridge network is
# exactly where VPN kill-switch rules tend to strand container traffic.
services:
  webpo-generator:
    build: https://github.com/ashton045/webpo-generator.git
    network_mode: host
    restart: unless-stopped
    environment:
      HOST: 127.0.0.1
      PORT: 8080
      WORKERS: 2
      API_TOKEN: ${WEBPO_TOKEN}

  relay:
    build: .
    network_mode: host
    restart: unless-stopped
    depends_on: [webpo-generator]
    environment:
      HOST: 127.0.0.1
      PORT: 8081
      RELAY_TOKEN: ${RELAY_TOKEN}
      WEBPO_URL: http://127.0.0.1:8080
      WEBPO_TOKEN: ${WEBPO_TOKEN}

  # Quick tunnel: no Cloudflare account needed, but the hostname changes on every
  # restart. Swap in `tunnel run --token ...` once a named tunnel exists.
  cloudflared:
    image: cloudflare/cloudflared:latest
    network_mode: host
    restart: unless-stopped
    depends_on: [relay]
    command: tunnel --no-autoupdate --url http://127.0.0.1:8081
